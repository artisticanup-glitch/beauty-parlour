# Every push to main builds the site and uploads it to Cloudflare Pages (roop-nikhar.pages.dev).
# Needs one GitHub secret: CLOUDFLARE_API_TOKEN (a Cloudflare API token with "Cloudflare Pages: Edit").
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Cloudflare Pages
        # The secret is cleaned first: spaces, line breaks and a pasted "Bearer " prefix are removed.
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | sed 's/^[[:space:]]*[Bb]earer[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Secret CLOUDFLARE_API_TOKEN is empty or missing"; exit 1; fi
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_API_TOKEN
          npx wrangler@4 pages deploy dist --project-name=roop-nikhar --branch=main --commit-dirty=true
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 55d2dce1e3a199d9bf9e982d3b3ee6ba
