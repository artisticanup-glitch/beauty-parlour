# Every push to main builds the site and uploads it to Cloudflare Pages (roop-nikhar.pages.dev).
# Needs one GitHub secret: CLOUDFLARE_API_TOKEN (a Cloudflare API token with "Cloudflare Pages: Edit").
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=roop-nikhar --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 55d2dce1e3a199d9bf9e982d3b3ee6ba
